<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/img/nss-logo.png">
    <title>Nilachala Saraswata Sangha — Family Verification</title>

    <!-- Tailwind CSS Play CDN (Tailwind 3.x JIT — generates utility classes in-browser) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI 4.12.14 (requires Tailwind 3.x) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" integrity="sha384-iMbeRReqpIEp0z+cPe0FZxnbV/GbGyGjDfou8Rjcr6KSJIptc245QXNVjLMtu5TR" crossorigin="anonymous">
    <!-- Alpine.js 3.14.8 -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        .badge { padding: 0.25rem 0.75rem !important; }
        .badge-xs { padding: 0.15rem 0.5rem !important; height: auto !important; min-height: 1.25rem; }
        .badge-sm { padding: 0.2rem 0.625rem !important; height: auto !important; min-height: 1.5rem; }
        .badge-status-active   { background-color: #16a34a !important; color: #fff !important; }
        .badge-status-inactive { background-color: #6b7280 !important; color: #fff !important; }
    </style>
</head>
<body class="bg-base-200 min-h-screen">

    <div x-data="familyApp()" x-init="init()" class="mx-auto px-3 py-4 sm:px-6 sm:py-6 lg:px-10 2xl:px-16">

        <!-- Header -->
        <header class="mb-4 sm:mb-6 flex items-center justify-between flex-wrap gap-3 sm:gap-4">
            <div class="flex items-center gap-3 sm:gap-4">
                <img src="/assets/img/nss-logo.png" alt="NSS Logo" class="h-10 w-10 sm:h-14 sm:w-14 object-contain">
                <div>
                    <h1 class="text-lg sm:text-2xl font-bold text-base-content">Nilachala Saraswata Sangha</h1>
                    <p class="text-xs sm:text-sm text-base-content/60">Tier 4 — Family Verification</p>
                </div>
            </div>
            <nav class="flex gap-2 flex-wrap">
                <a href="/" class="btn btn-sm btn-ghost">Bootstrap</a>
                <a href="/foundation" class="btn btn-sm btn-ghost">Foundation</a>
                <a href="/organization" class="btn btn-sm btn-ghost">Organization</a>
                <a href="/person" class="btn btn-sm btn-ghost">Person</a>
                <a href="/family" class="btn btn-sm btn-active">Family</a>
                <a href="/membership" class="btn btn-sm btn-ghost">Membership</a>
            </nav>
        </header>

        <!-- System Status -->
        <section class="card bg-base-100 shadow-sm mb-4 sm:mb-6 max-w-md mx-auto">
            <div class="card-body py-3 text-center">
                <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50 justify-center">System Status</h2>
                <div class="flex items-center justify-center gap-2 mt-1">
                    <template x-if="health.loading">
                        <span class="flex items-center gap-2 text-sm text-base-content/60">
                            <span class="loading loading-spinner loading-xs"></span>
                            Checking...
                        </span>
                    </template>
                    <template x-if="!health.loading && health.connected">
                        <span class="flex items-center gap-2">
                            <span class="badge badge-success badge-xs"></span>
                            <span class="text-sm">Database Connected</span>
                        </span>
                    </template>
                    <template x-if="!health.loading && !health.connected">
                        <span class="flex items-center gap-2">
                            <span class="badge badge-error badge-xs"></span>
                            <span class="text-sm">Database Unavailable</span>
                        </span>
                    </template>
                </div>
            </div>
        </section>

        <!-- Main Content: Family List + Detail -->
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 xl:gap-6">

            <!-- Family List (left / full) -->
            <section class="card bg-base-100 shadow-sm xl:col-span-2">
                <div class="card-body p-3 sm:p-4 xl:p-6">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                        <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50">Families</h2>
                        <span class="badge badge-ghost badge-sm" x-text="families.length + ' families'"></span>
                    </div>

                    <template x-if="familiesLoading">
                        <div class="flex justify-center py-6">
                            <span class="loading loading-spinner loading-md"></span>
                        </div>
                    </template>

                    <template x-if="!familiesLoading && familiesError">
                        <div class="alert alert-error mt-2">
                            <span class="text-sm">Failed to load families.</span>
                        </div>
                    </template>

                    <template x-if="!familiesLoading && !familiesError && families.length === 0">
                        <div class="py-4">
                            <p class="text-sm text-base-content/60">No families found.</p>
                        </div>
                    </template>

                    <template x-if="!familiesLoading && !familiesError && families.length > 0">
                        <div class="overflow-x-auto mt-2">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Family ID</th>
                                        <th>Family Name</th>
                                        <th>Sakha</th>
                                        <th>Formed Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="f in families" :key="f.family_group_pk">
                                        <tr class="cursor-pointer hover"
                                            :class="{ 'bg-base-200': selectedFamily?.family_group_pk === f.family_group_pk }"
                                            @click="selectFamily(f)">
                                            <td class="font-mono text-xs whitespace-nowrap" x-text="f.family_id"></td>
                                            <td class="text-xs font-medium" x-text="f.family_name"></td>
                                            <td class="text-xs whitespace-nowrap">
                                                <span x-text="f.sakha_name"></span>
                                                <span class="text-base-content/40 font-mono ml-1" x-text="f.sakha_code ? '(' + f.sakha_code + ')' : ''"></span>
                                            </td>
                                            <td class="text-xs whitespace-nowrap" x-text="f.formed_date || '—'"></td>
                                            <td class="whitespace-nowrap">
                                                <span class="badge badge-xs whitespace-nowrap"
                                                      :class="f.is_active ? 'badge-status-active' : 'badge-status-inactive'"
                                                      x-text="f.status_name"></span>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
            </section>

            <!-- Family Detail (right) -->
            <section class="card bg-base-100 shadow-sm">
                <div class="card-body p-3 sm:p-4 xl:p-6">
                    <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50">Family Detail</h2>

                    <template x-if="!selectedFamily && !detailLoading">
                        <p class="text-sm text-base-content/60 py-2">
                            Select a family from the list to view details.
                        </p>
                    </template>

                    <template x-if="detailLoading">
                        <div class="flex justify-center py-6">
                            <span class="loading loading-spinner loading-md"></span>
                        </div>
                    </template>

                    <template x-if="selectedFamily && !detailLoading">
                        <div class="mt-2 space-y-3">
                            <!-- Identity -->
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
                                <div>
                                    <span class="text-base-content/50">Family ID:</span>
                                    <span class="font-mono font-semibold" x-text="selectedFamily.family_id"></span>
                                </div>
                                <div>
                                    <span class="text-base-content/50">Status:</span>
                                    <span class="badge badge-xs"
                                          :class="selectedFamily.is_active ? 'badge-status-active' : 'badge-status-inactive'"
                                          x-text="selectedFamily.status_name"></span>
                                </div>
                                <div>
                                    <span class="text-base-content/50">Name:</span>
                                    <span class="font-semibold" x-text="selectedFamily.family_name"></span>
                                </div>
                                <div>
                                    <span class="text-base-content/50">Sakha:</span>
                                    <span x-text="selectedFamily.sakha_name"></span>
                                </div>
                                <div>
                                    <span class="text-base-content/50">Formed:</span>
                                    <span x-text="selectedFamily.formed_date || '—'"></span>
                                </div>
                            </div>
                            <div class="text-xs" x-show="selectedFamily.remarks">
                                <span class="text-base-content/50">Remarks:</span>
                                <span x-text="selectedFamily.remarks"></span>
                            </div>

                            <!-- Members -->
                            <div>
                                <div class="divider my-1"></div>
                                <h3 class="text-xs font-semibold uppercase tracking-wide text-base-content/50">
                                    Members
                                    <span class="badge badge-ghost badge-xs ml-1" x-text="familyMembers.length"></span>
                                </h3>

                                <template x-if="membersLoading">
                                    <div class="flex items-center gap-2 py-2">
                                        <span class="loading loading-spinner loading-xs"></span>
                                        <span class="text-sm text-base-content/60">Loading...</span>
                                    </div>
                                </template>

                                <template x-if="!membersLoading && familyMembers.length === 0">
                                    <p class="text-xs text-base-content/60 mt-1">No members.</p>
                                </template>

                                <template x-if="!membersLoading && familyMembers.length > 0">
                                    <div class="overflow-x-auto mt-1">
                                        <table class="table table-xs">
                                            <thead>
                                                <tr>
                                                    <th>Person ID</th>
                                                    <th>Name</th>
                                                    <th>Relationship</th>
                                                    <th>Since</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="m in familyMembers" :key="m.family_relationship_pk">
                                                    <tr>
                                                        <td class="font-mono text-xs" x-text="m.person_id"></td>
                                                        <td class="text-xs" x-text="formatMemberName(m)"></td>
                                                        <td class="text-xs">
                                                            <span class="badge badge-xs badge-primary" x-text="m.relationship_type_name"></span>
                                                        </td>
                                                        <td class="text-xs" x-text="m.effective_from"></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </div>

                            <!-- Head History -->
                            <div>
                                <div class="divider my-1"></div>
                                <h3 class="text-xs font-semibold uppercase tracking-wide text-base-content/50">
                                    Head History
                                    <span class="badge badge-ghost badge-xs ml-1" x-text="headHistory.length"></span>
                                </h3>

                                <template x-if="headLoading">
                                    <div class="flex items-center gap-2 py-2">
                                        <span class="loading loading-spinner loading-xs"></span>
                                        <span class="text-sm text-base-content/60">Loading...</span>
                                    </div>
                                </template>

                                <template x-if="!headLoading && headHistory.length === 0">
                                    <p class="text-xs text-base-content/60 mt-1">No head history.</p>
                                </template>

                                <template x-if="!headLoading && headHistory.length > 0">
                                    <div class="space-y-1 mt-1">
                                        <template x-for="h in headHistory" :key="h.family_head_history_pk">
                                            <div class="border border-base-300 rounded-lg p-2 text-xs">
                                                <div class="flex items-center gap-2">
                                                    <span class="font-semibold" x-text="formatMemberName(h)"></span>
                                                    <span class="font-mono text-base-content/40" x-text="h.person_id"></span>
                                                    <template x-if="!h.effective_to">
                                                        <span class="badge badge-xs badge-status-active">Current</span>
                                                    </template>
                                                </div>
                                                <div class="text-base-content/60 mt-0.5">
                                                    <span x-text="h.effective_from"></span>
                                                    <span x-text="h.effective_to ? ' — ' + h.effective_to : ' — present'"></span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </section>

        </div>

        <!-- Footer -->
        <footer class="text-center text-xs text-base-content/30 mt-6">
            <p>&copy; 2026 Nilachala Saraswata Sangha. All rights reserved.</p>
        </footer>

    </div>

    <script src="/assets/js/family.js"></script>
</body>
</html>
