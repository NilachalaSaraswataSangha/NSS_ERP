<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/img/nss-logo.png">
    <title>Nilachala Saraswata Sangha — Organization Verification</title>

    <!-- Tailwind CSS Play CDN (Tailwind 3.x JIT — generates utility classes in-browser) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI 4.12.14 (requires Tailwind 3.x) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" integrity="sha384-iMbeRReqpIEp0z+cPe0FZxnbV/GbGyGjDfou8Rjcr6KSJIptc245QXNVjLMtu5TR" crossorigin="anonymous">
    <!-- Alpine.js 3.14.8 -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- Badge breathing room — must be last to override DaisyUI CDN -->
    <style>
        .badge { padding: 0.25rem 0.75rem !important; }
        .badge-xs { padding: 0.15rem 0.5rem !important; height: auto !important; min-height: 1.25rem; }
        .badge-sm { padding: 0.2rem 0.625rem !important; height: auto !important; min-height: 1.5rem; }
        /* Status colors — white text on distinct backgrounds */
        .badge-status-active     { background-color: #16a34a !important; color: #fff !important; }
        .badge-status-proposed   { background-color: #2563eb !important; color: #fff !important; }
        .badge-status-approved   { background-color: #0d9488 !important; color: #fff !important; }
        .badge-status-suspended  { background-color: #dc2626 !important; color: #fff !important; }
        .badge-status-inactive   { background-color: #6b7280 !important; color: #fff !important; }
        .badge-status-lapsed     { background-color: #d97706 !important; color: #fff !important; }
        .badge-status-transferred{ background-color: #7c3aed !important; color: #fff !important; }
        .badge-status-resigned   { background-color: #9ca3af !important; color: #fff !important; }
        .badge-status-expelled   { background-color: #991b1b !important; color: #fff !important; }
        .badge-status-deceased   { background-color: #1f2937 !important; color: #fff !important; }
        .badge-status-dissolved  { background-color: #78350f !important; color: #fff !important; }
        .badge-status-archived   { background-color: #374151 !important; color: #fff !important; }
        .badge-status-expired    { background-color: #4b5563 !important; color: #fff !important; }
    </style>
</head>
<body class="bg-base-200 min-h-screen">

    <div x-data="organizationApp()" x-init="init()" class="mx-auto px-3 py-4 sm:px-6 sm:py-6 lg:px-10 2xl:px-16">

        <!-- Header -->
        <header class="mb-4 sm:mb-6 flex items-center justify-between flex-wrap gap-3 sm:gap-4">
            <div class="flex items-center gap-3 sm:gap-4">
                <img src="/assets/img/nss-logo.png" alt="NSS Logo" class="h-10 w-10 sm:h-14 sm:w-14 object-contain">
                <div>
                    <h1 class="text-lg sm:text-2xl font-bold text-base-content">Nilachala Saraswata Sangha</h1>
                    <p class="text-xs sm:text-sm text-base-content/60">Tier 2 — Organization Verification</p>
                </div>
            </div>
            <nav class="flex gap-2">
                <a href="/" class="btn btn-sm btn-ghost">Bootstrap</a>
                <a href="/foundation" class="btn btn-sm btn-ghost">Foundation</a>
                <a href="/organization" class="btn btn-sm btn-active">Organization</a>
                <a href="/person" class="btn btn-sm btn-ghost">Person</a>
            </nav>
        </header>

        <!-- System Status (centred) -->
        <section class="card bg-base-100 shadow-sm mb-4 sm:mb-6 max-w-md mx-auto">
            <div class="card-body py-3 text-center">
                <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50 justify-center">System Status</h2>
                <div class="flex items-center justify-center gap-2 mt-1">
                    <template x-if="health.loading">
                        <span class="flex items-center gap-2 text-sm text-base-content/60">
                            <span class="loading loading-spinner loading-xs"></span>
                            Checking...
                        </span>
                    </template>
                    <template x-if="!health.loading && health.connected">
                        <span class="flex items-center gap-2">
                            <span class="badge badge-success badge-xs"></span>
                            <span class="text-sm">Database Connected</span>
                        </span>
                    </template>
                    <template x-if="!health.loading && !health.connected">
                        <span class="flex items-center gap-2">
                            <span class="badge badge-error badge-xs"></span>
                            <span class="text-sm">Database Unavailable</span>
                        </span>
                    </template>
                </div>
            </div>
        </section>

        <!-- Tab Bar (scrollable on mobile) -->
        <div class="overflow-x-auto mb-4 -mx-3 px-3 sm:mx-0 sm:px-0">
            <div class="tabs tabs-boxed bg-base-100 shadow-sm inline-flex min-w-max">
                <button class="tab tab-sm sm:tab-md" :class="{ 'tab-active': activeTab === 'reference' }" @click="switchTab('reference')">Reference Data</button>
                <button class="tab tab-sm sm:tab-md" :class="{ 'tab-active': activeTab === 'organizations' }" @click="switchTab('organizations')">Organizations</button>
                <button class="tab tab-sm sm:tab-md" :class="{ 'tab-active': activeTab === 'hierarchy' }" @click="switchTab('hierarchy')">Hierarchy</button>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- TAB 1: Reference Data (Types + Statuses)                  -->
        <!-- ═══════════════════════════════════════════════════════════ -->
        <div x-show="activeTab === 'reference'" x-cloak>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 xl:gap-6">

                <!-- Organization Types -->
                <section class="card bg-base-100 shadow-sm">
                    <div class="card-body p-3 sm:p-4 xl:p-6">
                        <div class="flex items-center justify-between">
                            <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50">Organization Types</h2>
                            <span class="badge badge-ghost badge-sm" x-text="orgTypes.length + ' types'"></span>
                        </div>

                        <template x-if="orgTypesLoading">
                            <div class="flex justify-center py-6">
                                <span class="loading loading-spinner loading-md"></span>
                            </div>
                        </template>

                        <template x-if="!orgTypesLoading && orgTypesError">
                            <div class="alert alert-error mt-2">
                                <span class="text-sm">Failed to load organization types.</span>
                            </div>
                        </template>

                        <template x-if="!orgTypesLoading && !orgTypesError && orgTypes.length > 0">
                            <div class="overflow-x-auto mt-2">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>Code</th>
                                            <th>Name</th>
                                            <th>Description</th>
                                            <th>Order</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="t in orgTypes" :key="t.organization_type_pk">
                                            <tr>
                                                <td class="font-mono text-xs whitespace-nowrap" x-text="t.organization_type_code"></td>
                                                <td class="text-xs" x-text="t.organization_type_name"></td>
                                                <td class="text-xs text-base-content/60 max-w-xs" x-text="t.description || '—'"></td>
                                                <td class="text-center text-xs" x-text="t.sort_order"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- Lifecycle Statuses -->
                <section class="card bg-base-100 shadow-sm">
                    <div class="card-body p-3 sm:p-4 xl:p-6">
                        <div class="flex items-center justify-between">
                            <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50">Lifecycle Statuses</h2>
                            <span class="badge badge-ghost badge-sm" x-text="orgStatuses.length + ' statuses'"></span>
                        </div>

                        <template x-if="orgStatusesLoading">
                            <div class="flex justify-center py-6">
                                <span class="loading loading-spinner loading-md"></span>
                            </div>
                        </template>

                        <template x-if="!orgStatusesLoading && orgStatusesError">
                            <div class="alert alert-error mt-2">
                                <span class="text-sm">Failed to load statuses.</span>
                            </div>
                        </template>

                        <template x-if="!orgStatusesLoading && !orgStatusesError && orgStatuses.length > 0">
                            <div class="overflow-x-auto mt-2">
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th>#</th>
                                                <th>Badge</th>
                                                <th>Code</th>
                                                <th>Description</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="s in orgStatuses" :key="s.status_pk + '-row'">
                                                <tr>
                                                    <td class="text-center text-xs text-base-content/40" x-text="s.sort_order"></td>
                                                    <td>
                                                        <span class="badge badge-xs"
                                                              :class="{
                                                                  'badge-status-active': s.status_code === 'ACTIVE',
                                                                  'badge-status-proposed': s.status_code === 'PROPOSED',
                                                                  'badge-status-approved': s.status_code === 'APPROVED',
                                                                  'badge-status-suspended': s.status_code === 'SUSPENDED',
                                                                  'badge-status-inactive': s.status_code === 'INACTIVE',
                                                                  'badge-status-lapsed': s.status_code === 'LAPSED',
                                                                  'badge-status-transferred': s.status_code === 'TRANSFERRED',
                                                                  'badge-status-resigned': s.status_code === 'RESIGNED',
                                                                  'badge-status-expelled': s.status_code === 'EXPELLED',
                                                                  'badge-status-deceased': s.status_code === 'DECEASED',
                                                                  'badge-status-dissolved': s.status_code === 'DISSOLVED',
                                                                  'badge-status-archived': s.status_code === 'ARCHIVED',
                                                                  'badge-status-expired': s.status_code === 'EXPIRED'
                                                              }"
                                                              x-text="s.status_name"></span>
                                                    </td>
                                                    <td class="font-mono text-xs whitespace-nowrap" x-text="s.status_code"></td>
                                                    <td class="text-xs text-base-content/60 max-w-xs" x-text="s.description || '—'"></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                        </template>
                    </div>
                </section>

            </div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- TAB 2: Organizations (list + detail + children)           -->
        <!-- ═══════════════════════════════════════════════════════════ -->
        <div x-show="activeTab === 'organizations'" x-cloak>
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 xl:gap-6">

                <!-- Organization List (left / full) -->
                <section class="card bg-base-100 shadow-sm xl:col-span-2">
                    <div class="card-body p-3 sm:p-4 xl:p-6">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50">Organizations</h2>
                            <span class="badge badge-ghost badge-sm" x-text="organizations.length + ' organizations'"></span>
                        </div>

                        <!-- Filters -->
                        <div class="flex flex-wrap gap-2 mt-2">
                            <select class="select select-bordered select-xs sm:select-sm"
                                    x-model="selectedTypeFilter" @change="filterOrganizations()">
                                <option value="">All Types</option>
                                <template x-for="t in orgTypes" :key="t.organization_type_code">
                                    <option :value="t.organization_type_code" x-text="t.organization_type_name"></option>
                                </template>
                            </select>
                            <select class="select select-bordered select-xs sm:select-sm"
                                    x-model="selectedStatusFilter" @change="filterOrganizations()"
                                    :disabled="['KENDRA', 'NILACHALA_KUTIRA', 'SMRUTI_MANDIRA'].includes(selectedTypeFilter)"
                                    :class="{ 'opacity-40 cursor-not-allowed': ['KENDRA', 'NILACHALA_KUTIRA', 'SMRUTI_MANDIRA'].includes(selectedTypeFilter) }">
                                <option value="">All Statuses</option>
                                <template x-for="s in orgStatuses" :key="s.status_code">
                                    <option :value="s.status_code" x-text="s.status_name"></option>
                                </template>
                            </select>
                        </div>

                        <template x-if="orgsLoading">
                            <div class="flex justify-center py-6">
                                <span class="loading loading-spinner loading-md"></span>
                            </div>
                        </template>

                        <template x-if="!orgsLoading && orgsError">
                            <div class="alert alert-error mt-2">
                                <span class="text-sm">Failed to load organizations.</span>
                            </div>
                        </template>

                        <template x-if="!orgsLoading && !orgsError && organizations.length === 0">
                            <div class="py-4">
                                <p class="text-sm text-base-content/60">No organizations match the current filters.</p>
                            </div>
                        </template>

                        <template x-if="!orgsLoading && !orgsError && organizations.length > 0">
                            <div class="overflow-x-auto mt-2">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>Code</th>
                                            <th>Name</th>
                                            <th>Type</th>
                                            <th>Status</th>
                                            <th>Parent</th>
                                            <th>Location</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="org in organizations" :key="org.organization_pk">
                                            <tr class="cursor-pointer hover"
                                                :class="{ 'bg-base-200': selectedOrg?.organization_pk === org.organization_pk }"
                                                @click="selectOrganization(org)">
                                                <td class="font-mono text-xs whitespace-nowrap" x-text="org.organization_code || '—'"></td>
                                                <td class="text-xs font-medium" x-text="org.organization_name"></td>
                                                <td class="whitespace-nowrap">
                                                    <span class="badge badge-xs badge-primary whitespace-nowrap" x-text="org.organization_type_name"></span>
                                                </td>
                                                <td class="whitespace-nowrap">
                                                    <span class="badge badge-xs whitespace-nowrap"
                                                          :class="{
                                                              'badge-status-active': org.status_code === 'ACTIVE',
                                                              'badge-status-proposed': org.status_code === 'PROPOSED',
                                                              'badge-status-approved': org.status_code === 'APPROVED',
                                                              'badge-status-suspended': org.status_code === 'SUSPENDED',
                                                              'badge-status-inactive': org.status_code === 'INACTIVE',
                                                              'badge-status-lapsed': org.status_code === 'LAPSED',
                                                              'badge-status-transferred': org.status_code === 'TRANSFERRED',
                                                              'badge-status-resigned': org.status_code === 'RESIGNED',
                                                              'badge-status-expelled': org.status_code === 'EXPELLED',
                                                              'badge-status-deceased': org.status_code === 'DECEASED',
                                                              'badge-status-dissolved': org.status_code === 'DISSOLVED',
                                                              'badge-status-archived': org.status_code === 'ARCHIVED',
                                                              'badge-status-expired': org.status_code === 'EXPIRED'
                                                          }"
                                                          x-text="org.status_name"></span>
                                                </td>
                                                <td class="text-xs" x-text="org.parent_organization_name || '—'"></td>
                                                <td class="text-xs text-base-content/60">
                                                    <span x-text="[org.address_line_2, org.state_name, org.country_name].filter(Boolean).join(', ') || '—'"></span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- Organization Detail + Children (right) -->
                <section class="card bg-base-100 shadow-sm">
                    <div class="card-body p-3 sm:p-4 xl:p-6">
                        <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50">Organization Detail</h2>

                        <template x-if="!selectedOrg">
                            <p class="text-sm text-base-content/60 py-2">
                                Select an organization from the list to view details.
                            </p>
                        </template>

                        <template x-if="selectedOrg">
                            <div class="mt-2 space-y-3">
                                <!-- Key fields -->
                                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
                                    <div>
                                        <span class="text-base-content/50">Name:</span>
                                        <span class="font-semibold" x-text="selectedOrg.organization_name"></span>
                                    </div>
                                    <div>
                                        <span class="text-base-content/50">Code:</span>
                                        <span class="font-mono" x-text="selectedOrg.organization_code || '—'"></span>
                                    </div>
                                    <div>
                                        <span class="text-base-content/50">ID:</span>
                                        <span class="font-mono" x-text="selectedOrg.organization_id || '—'"></span>
                                    </div>
                                    <div>
                                        <span class="text-base-content/50">Type:</span>
                                        <span x-text="selectedOrg.organization_type_name"></span>
                                    </div>
                                    <div>
                                        <span class="text-base-content/50">Status:</span>
                                        <span x-text="selectedOrg.status_name"></span>
                                    </div>
                                    <div>
                                        <span class="text-base-content/50">Parent:</span>
                                        <span x-text="selectedOrg.parent_organization_name || 'None (root)'"></span>
                                    </div>
                                </div>

                                <!-- Address -->
                                <div class="text-xs" x-show="selectedOrg.address_line_1 || selectedOrg.address_line_2">
                                    <span class="text-base-content/50">Address:</span>
                                    <span x-text="[selectedOrg.address_line_1, selectedOrg.address_line_2].filter(Boolean).join(', ')"></span>
                                    <template x-if="selectedOrg.postal_code">
                                        <span x-text="' - ' + selectedOrg.postal_code"></span>
                                    </template>
                                </div>

                                <!-- Contact -->
                                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs" x-show="selectedOrg.phone_number || selectedOrg.mobile_number">
                                    <div x-show="selectedOrg.phone_number">
                                        <span class="text-base-content/50">Phone:</span>
                                        <span x-text="selectedOrg.phone_number"></span>
                                    </div>
                                    <div x-show="selectedOrg.mobile_number">
                                        <span class="text-base-content/50">Mobile:</span>
                                        <span x-text="selectedOrg.mobile_number"></span>
                                    </div>
                                </div>

                                <!-- Online Presence -->
                                <div class="text-xs space-y-1">
                                    <div>
                                        <span class="text-base-content/50">NSS Email:</span>
                                        <a :href="'mailto:' + selectedOrg.email" class="link link-primary" x-text="selectedOrg.email"></a>
                                    </div>
                                    <div x-show="selectedOrg.org_email">
                                        <span class="text-base-content/50">Organization Email:</span>
                                        <a :href="'mailto:' + selectedOrg.org_email" class="link link-primary" x-text="selectedOrg.org_email"></a>
                                    </div>
                                    <div>
                                        <span class="text-base-content/50">NSS Website:</span>
                                        <a :href="selectedOrg.website_url" target="_blank" rel="noopener noreferrer" class="link link-primary" x-text="selectedOrg.website_url"></a>
                                    </div>
                                    <div x-show="selectedOrg.org_website_url">
                                        <span class="text-base-content/50">Organization Website:</span>
                                        <a :href="selectedOrg.org_website_url" target="_blank" rel="noopener noreferrer" class="link link-primary" x-text="selectedOrg.org_website_url"></a>
                                    </div>
                                    <div>
                                        <span class="text-base-content/50">NSS YouTube:</span>
                                        <a :href="selectedOrg.youtube_channel_url" target="_blank" rel="noopener noreferrer" class="link link-primary" x-text="selectedOrg.youtube_channel_url"></a>
                                    </div>
                                    <div x-show="selectedOrg.org_youtube_channel_url">
                                        <span class="text-base-content/50">Organization YouTube:</span>
                                        <a :href="selectedOrg.org_youtube_channel_url" target="_blank" rel="noopener noreferrer" class="link link-primary" x-text="selectedOrg.org_youtube_channel_url"></a>
                                    </div>
                                </div>

                                <!-- Geographic -->
                                <div class="text-xs" x-show="selectedOrg.district_name || selectedOrg.state_name || selectedOrg.country_name">
                                    <span class="text-base-content/50">Location:</span>
                                    <span x-text="[selectedOrg.district_name, selectedOrg.state_name, selectedOrg.country_name].filter(Boolean).join(', ')"></span>
                                </div>

                                <!-- Coordinates -->
                                <div class="text-xs" x-show="selectedOrg.latitude !== null && selectedOrg.longitude !== null">
                                    <span class="text-base-content/50">Coordinates:</span>
                                    <span x-text="selectedOrg.latitude + ', ' + selectedOrg.longitude"></span>
                                </div>

                                <!-- Children (hidden for org types that cannot have children) -->
                                <template x-if="!['NILACHALA_KUTIRA', 'SMRUTI_MANDIRA', 'PATHA_CHAKRA', 'SAKHA_ASANA', 'PARIBARIK_ASANA', 'PARIBARIK_SANGHA'].includes(selectedOrg.organization_type_code)">
                                <div>
                                <div class="divider my-1"></div>
                                <h3 class="text-xs font-semibold uppercase tracking-wide text-base-content/50">
                                    Children
                                    <span class="badge badge-ghost badge-xs ml-1" x-text="orgChildren.length"></span>
                                </h3>

                                <template x-if="childrenLoading">
                                    <div class="flex items-center gap-2 py-2">
                                        <span class="loading loading-spinner loading-xs"></span>
                                        <span class="text-sm text-base-content/60">Loading children...</span>
                                    </div>
                                </template>

                                <template x-if="!childrenLoading && childrenError">
                                    <div class="alert alert-error">
                                        <span class="text-sm">Failed to load children.</span>
                                    </div>
                                </template>

                                <template x-if="!childrenLoading && !childrenError && orgChildren.length === 0">
                                    <p class="text-xs text-base-content/60">No child organizations.</p>
                                </template>

                                <template x-if="!childrenLoading && !childrenError && orgChildren.length > 0">
                                    <div class="overflow-x-auto">
                                        <table class="table table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Name</th>
                                                    <th>Type</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="child in orgChildren" :key="child.organization_pk">
                                                    <tr class="cursor-pointer hover" @click="selectOrganization(child)">
                                                        <td class="text-xs font-medium" x-text="child.organization_name"></td>
                                                        <td>
                                                            <span class="badge badge-xs badge-primary" x-text="child.organization_type_name"></span>
                                                        </td>
                                                        <td>
                                                            <span class="badge badge-xs"
                                                                  :class="{
                                                                      'badge-status-active': child.status_code === 'ACTIVE',
                                                                      'badge-status-proposed': child.status_code === 'PROPOSED',
                                                                      'badge-status-approved': child.status_code === 'APPROVED',
                                                                      'badge-status-suspended': child.status_code === 'SUSPENDED',
                                                                      'badge-status-inactive': child.status_code === 'INACTIVE',
                                                                      'badge-status-lapsed': child.status_code === 'LAPSED',
                                                                      'badge-status-transferred': child.status_code === 'TRANSFERRED',
                                                                      'badge-status-resigned': child.status_code === 'RESIGNED',
                                                                      'badge-status-expelled': child.status_code === 'EXPELLED',
                                                                      'badge-status-deceased': child.status_code === 'DECEASED',
                                                                      'badge-status-dissolved': child.status_code === 'DISSOLVED',
                                                                      'badge-status-archived': child.status_code === 'ARCHIVED',
                                                                      'badge-status-expired': child.status_code === 'EXPIRED'
                                                                  }"
                                                                  x-text="child.status_name"></span>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </section>

            </div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- TAB 3: Hierarchy Tree                                     -->
        <!-- ═══════════════════════════════════════════════════════════ -->
        <div x-show="activeTab === 'hierarchy'" x-cloak>
            <section class="card bg-base-100 shadow-sm max-w-3xl">
                <div class="card-body p-3 sm:p-4 xl:p-6">
                    <div class="flex items-center justify-between">
                        <h2 class="card-title text-sm uppercase tracking-wide text-base-content/50">Organization Hierarchy</h2>
                        <span class="badge badge-ghost badge-sm" x-text="hierarchy.length + ' nodes'"></span>
                    </div>

                    <template x-if="hierarchyLoading">
                        <div class="flex justify-center py-6">
                            <span class="loading loading-spinner loading-md"></span>
                        </div>
                    </template>

                    <template x-if="!hierarchyLoading && hierarchyError">
                        <div class="alert alert-error mt-2">
                            <span class="text-sm">Failed to load hierarchy.</span>
                        </div>
                    </template>

                    <template x-if="!hierarchyLoading && !hierarchyError && hierarchy.length === 0">
                        <div class="py-4">
                            <p class="text-sm text-base-content/60">No organizations in the hierarchy.</p>
                        </div>
                    </template>

                    <template x-if="!hierarchyLoading && !hierarchyError && hierarchy.length > 0">
                        <div class="mt-2 space-y-1">
                            <template x-for="node in hierarchy" :key="node.organization_pk">
                                <div class="flex items-center gap-2 py-1 hover:bg-base-200 rounded px-2"
                                     :style="depthIndent(node.depth)">
                                    <span class="text-base-content/30" x-show="node.depth > 0">└</span>
                                    <span class="badge badge-xs badge-primary" x-text="node.organization_type_name"></span>
                                    <span class="text-sm font-medium" x-text="node.organization_name"></span>
                                    <span class="font-mono text-xs text-base-content/40" x-show="node.organization_code"
                                          x-text="'(' + node.organization_code + ')'"></span>
                                    <span class="badge badge-xs ml-auto"
                                          :class="{
                                              'badge-status-active': node.status_code === 'ACTIVE',
                                              'badge-status-proposed': node.status_code === 'PROPOSED',
                                              'badge-status-approved': node.status_code === 'APPROVED',
                                              'badge-status-suspended': node.status_code === 'SUSPENDED',
                                              'badge-status-inactive': node.status_code === 'INACTIVE',
                                              'badge-status-lapsed': node.status_code === 'LAPSED',
                                              'badge-status-transferred': node.status_code === 'TRANSFERRED',
                                              'badge-status-resigned': node.status_code === 'RESIGNED',
                                              'badge-status-expelled': node.status_code === 'EXPELLED',
                                              'badge-status-deceased': node.status_code === 'DECEASED',
                                              'badge-status-dissolved': node.status_code === 'DISSOLVED',
                                              'badge-status-archived': node.status_code === 'ARCHIVED',
                                              'badge-status-expired': node.status_code === 'EXPIRED'
                                          }"
                                          x-text="node.status_name"></span>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <footer class="text-center text-xs text-base-content/30 mt-6">
            <p>&copy; 2026 Nilachala Saraswata Sangha. All rights reserved.</p>
        </footer>

    </div>

    <script src="/assets/js/organization.js"></script>
</body>
</html>
